logging:
  pattern:
    console: "[%d{HH:mm:ss.SSS}][%-5level][%logger.%method:line%line] - %msg%n"
  level:
    org:
      hibernate:
        type.descriptor.sql: trace
      springframework:
        mail: debug
jwt:
  access_secret: ${ACCESS_JWT_KEY}
#  refresh_secret: ${REFRESH_JWT_KEY}

# 모니터링 설정
management:
  endpoints:
    web:
      exposure:
        include: "*"  # 모든 엔드포인트 노출 (개발용)
      base-path: /actuator

  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

  metrics:
    enable:
      jvm: true
      system: true
      tomcat: true
      process: true
      hikaricp: true
      jdbc: true
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true